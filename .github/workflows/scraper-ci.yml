name: scraper CI

on:
  push:
    branches: [master, main]
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-ci.yml"
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-ci.yml"

defaults:
  run:
    working-directory: scraper

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The toolchain go.mod asks for (go 1.26), so CI and local builds agree.
          go-version-file: scraper/go.mod
          cache-dependency-path: scraper/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Built with a Go new enough for go.mod's go 1.26 (v2.1.x is not).
          version: v2.14.0
          working-directory: scraper
          args: --config=.golangci.yml

      - name: cmd/api independence check
        # cmd/api is documented as read-only and standalone (Postgres only,
        # no Temporal): it must never start depending on the
        # workflow/activity/Temporal-client code that cmd/worker and
        # cmd/scraper own, or it stops being safe to deploy/scale on its own.
        run: |
          coupled="$(go list -deps ./cmd/api | grep -E 'search-engine-scraper/internal/(workflows|activities)|go.temporal.io' || true)"
          if [ -n "$coupled" ]; then
            echo "cmd/api must not depend on Temporal/workflow/activity packages, found:"
            echo "$coupled"
            exit 1
          fi
