apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-engine
  labels:
    app.kubernetes.io/name: search-engine
spec:
  replicas: 1
  strategy:
    type: Recreate # one pod owns the model cache volume
  selector:
    matchLabels:
      app.kubernetes.io/name: search-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-engine
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database
          image: pgs-search-engine/postgres
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until [ "$(psql -h postgres -U pgs_search -d "$POSTGRES_DB" -tAc 'SELECT count(*) FROM local_bodies' 2>/dev/null)" = "753" ]; do
                echo "waiting for db-bootstrap"; sleep 5
              done
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_DB }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_SEARCH_DB_PASSWORD }
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: search-engine
          image: pgs-search-engine/search-engine
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          # Not pgs-config's SEARCH_GRPC_HOST: that is the client-side address, while this
          # server reads it as its bind address. The server creates the OpenSearch index
          # (alias np_web_pages -> np_web_pages_v<N>) itself when it is missing.
          env:
            - { name: SEARCH_GRPC_HOST, value: 0.0.0.0 }
            - { name: SEARCH_GRPC_PORT, value: "50051" }
            - { name: OPENSEARCH_HOST, value: opensearch }
            - { name: OPENSEARCH_PORT, value: "9200" }
            - { name: OPENSEARCH_INDEX, value: np_web_pages }
            - name: EMBEDDING_MODEL_NAME
              valueFrom:
                configMapKeyRef: { name: pgs-config, key: EMBEDDING_MODEL_NAME }
            - name: EMBEDDING_MODEL_REVISION
              valueFrom:
                configMapKeyRef: { name: pgs-config, key: EMBEDDING_MODEL_REVISION }
            - name: EMBEDDING_DIMENSIONS
              valueFrom:
                configMapKeyRef: { name: pgs-config, key: EMBEDDING_DIMENSIONS }
            - { name: TRANSLATION_MODEL_REVISION, value: f8d333a098d19b4fd9a8b18f94170487ad3f821d }
            - name: TRANSLATION_BACKEND
              valueFrom:
                configMapKeyRef: { name: pgs-config, key: TRANSLATION_BACKEND }
            - name: TRANSLATION_API_BASE_URL
              valueFrom:
                configMapKeyRef: { name: pgs-config, key: TRANSLATION_API_BASE_URL }
            - name: TRANSLATION_API_MODEL
              valueFrom:
                configMapKeyRef: { name: pgs-config, key: TRANSLATION_API_MODEL }
            - name: TRANSLATION_API_KEY
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: TRANSLATION_API_KEY, optional: true }
            # Dense retrieval through pgs_db (page_embeddings, pgvector) as pgs_search.
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_DB }
            - name: PGS_SEARCH_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_SEARCH_DB_PASSWORD }
            - name: DATABASE_URL
              value: postgresql+psycopg://pgs_search:$(PGS_SEARCH_DB_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - { name: DB_APPLICATION_NAME, value: pgs-search }
          volumeMounts:
            - name: models
              mountPath: /home/app/.cache/huggingface
          # The server reports SERVING on grpc.health.v1 only after loading every model;
          # the first start downloads them, so allow up to 30 minutes.
          startupProbe:
            grpc:
              port: 50051
              service: search.engine.v1.SearchService
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            grpc:
              port: 50051
              service: search.engine.v1.SearchService
            periodSeconds: 15
          livenessProbe:
            grpc:
              port: 50051
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 500m, memory: 4Gi }
            limits: { memory: 6Gi }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: search-models
