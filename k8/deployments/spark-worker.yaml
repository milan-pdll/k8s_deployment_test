# Spark standalone workers: run the executors that do the per-page work (read the page
# from S3, ClamAV scan, text extraction). Same image and interpreter as the driver.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  labels:
    app.kubernetes.io/name: spark-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spark-worker
          image: pgs-search-engine/etl
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/dumb-init", "--", "/opt/etl-venv/bin/spark-class",
                    "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
                    "--cores", "2", "--memory", "2g", "--work-dir", "/tmp/spark-work"]
          envFrom:
            - configMapRef:
                name: pgs-config
          env:
            - { name: CLAMD_TIMEOUT_SECONDS, value: "30" }
            - { name: S3_ENDPOINT, value: "http://s3:4566" }
            - { name: AWS_REGION, value: us-east-1 }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: S3_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: S3_SECRET_ACCESS_KEY }
          ports:
            - { name: ui, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /, port: ui }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 3Gi }
