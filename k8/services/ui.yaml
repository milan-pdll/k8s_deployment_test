# Next.js UI. From the host:
#   kubectl -n pgs-search-engine port-forward svc/ui 3000:3000
# The UI's server calls the API itself (API_INTERNAL_URL); nothing is baked into the
# image at build time.
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
spec:
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 3000
      targetPort: http
