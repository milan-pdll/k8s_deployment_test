# Unified entry point service for PGS Search Engine web UI and API.
# Accessible in-cluster at http://nginx:80
# Accessible from college LAN on any node IP at the NodePort assigned by Kubernetes.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
