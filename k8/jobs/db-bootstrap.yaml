# Database bootstrap, the Kubernetes form of compose's db-migrate -> db-seed ->
# db-role-passwords. Init containers run in order, each with one job:
#   wait-for-postgres -> migrate (alembic upgrade head) -> seed (gazetteer + boundaries)
#   -> role-passwords (the main container; sets the service roles' login passwords).
# All steps are idempotent. The Job deletes itself 10 minutes after finishing, so the next
# `kubectl apply -k k8/` runs it again (e.g. after a new migration ships in the image).
# Services wait for its result in their own init container (see deployments/api.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  labels:
    app.kubernetes.io/name: db-bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: pgs-search-engine/postgres
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 3; done"]
          securityContext:
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
        - name: migrate
          image: pgs-search-engine/db-migrate
          imagePullPolicy: IfNotPresent
          # Image default: python -m alembic upgrade head (schema, extensions, roles).
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_DB }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: DB_APPLICATION_NAME
              value: pgs-db-bootstrap
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
        - name: seed
          image: pgs-search-engine/db-migrate
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python scripts/seed_geography.py && python scripts/seed_boundaries.py && python scripts/seed_domains.py"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_DB }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: DB_APPLICATION_NAME
              value: pgs-db-bootstrap
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      containers:
        - name: role-passwords
          image: pgs-search-engine/postgres
          imagePullPolicy: IfNotPresent
          command:
            - psql
            - --host=postgres
            - --username=$(POSTGRES_USER)
            - --dbname=$(POSTGRES_DB)
            - --no-psqlrc
            - --quiet
            - --file=/opt/pgs/set-role-passwords.sql
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_USER }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_DB }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: POSTGRES_PASSWORD }
            - name: PGS_API_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_API_DB_PASSWORD }
            - name: PGS_ETL_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_ETL_DB_PASSWORD }
            - name: PGS_SEARCH_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_SEARCH_DB_PASSWORD }
            - name: PGS_SCRAPER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_SCRAPER_DB_PASSWORD }
            - name: PGS_JOBS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pgs-secrets, key: PGS_JOBS_DB_PASSWORD }
          securityContext:
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
