# PGS Search Engine on Kubernetes -- single-node, non-HA (one replica of everything).
#
#   cp k8/secrets/secrets.env.example k8/secrets/secrets.env   # once; then change the passwords
#   kubectl apply -k k8/
#
# Manifests are grouped by resource kind, one resource per file (services/, deployments/,
# configmaps/, ...). The default stack below is the same set of services as
# `docker compose up`; search and the UI/web gateway are included by default. The optional
# parts at the end can be enabled by uncommenting a whole block. See k8/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pgs-search-engine

labels:
  - pairs:
      app.kubernetes.io/part-of: pgs-search-engine
    includeSelectors: false

resources:
  # --- Namespace -----------------------------------------------------------------
  - namespaces/pgs-search-engine.yaml
  # --- Config --------------------------------------------------------------------
  - configmaps/pgs-config.yaml
  - configmaps/airflow-config.yaml
  - configmaps/airflow-pod-template.yaml
  # --- Storage -------------------------------------------------------------------
  - persistentvolumeclaims/airflow-logs.yaml
  - persistentvolumeclaims/etl-models.yaml
  - persistentvolumeclaims/clamav-db.yaml
  # --- Access control (Airflow's KubernetesExecutor launches task pods) ------------
  - serviceaccounts/airflow-scheduler.yaml
  - serviceaccounts/airflow-webserver.yaml
  - serviceaccounts/airflow-task.yaml
  - roles/airflow-pod-launcher.yaml
  - roles/airflow-pod-log-reader.yaml
  - rolebindings/airflow-scheduler.yaml
  - rolebindings/airflow-webserver.yaml
  # --- Services ------------------------------------------------------------------
  - services/postgres.yaml
  - services/kafka.yaml
  - services/opensearch.yaml
  - services/clamav.yaml
  - services/api.yaml
  - services/airflow-db.yaml
  - services/airflow-webserver.yaml
  - services/temporal-db.yaml
  - services/temporal.yaml
  - services/temporal-ui.yaml
  - services/spark-master.yaml
  # --- StatefulSets (data stores) ------------------------------------------------
  - statefulsets/postgres.yaml
  - statefulsets/kafka.yaml
  - statefulsets/opensearch.yaml
  - statefulsets/airflow-db.yaml
  - statefulsets/temporal-db.yaml
  # --- Deployments ---------------------------------------------------------------
  - deployments/api.yaml
  - deployments/clamav.yaml
  - deployments/airflow-scheduler.yaml
  - deployments/airflow-webserver.yaml
  # Temporal runs both the crawl workflows and the ETL batch workflows.
  - deployments/temporal.yaml
  - deployments/temporal-ui.yaml
  - networkpolicies/temporal-ui-no-ingress.yaml
  # The ETL: Spark standalone cluster + the Temporal ETL worker (the Spark driver).
  - deployments/spark-master.yaml
  - deployments/spark-worker.yaml
  - deployments/etl-worker.yaml
  # --- Jobs (bootstrap; re-run on every apply) ------------------------------------
  - jobs/db-bootstrap.yaml
  - jobs/kafka-init.yaml
  - jobs/airflow-init.yaml

  # ================================================================================
  # Search and the UI/web gateway are enabled by default; remaining optional parts can be
  # enabled by uncommenting a whole block.
  # ================================================================================
  # --- search: gRPC search engine (search-engine:50051) and the search indexer
  #     (PostgreSQL Silver -> OpenSearch). Needs ~5 GB RAM; the first start downloads
  #     ~4.5 GB of models.
  - persistentvolumeclaims/search-models.yaml
  - services/search-engine.yaml
  - deployments/search-engine.yaml
  - deployments/search-indexer.yaml
  - networkpolicies/search-engine-ingress.yaml   # only the api may call the gRPC port

  # --- scraper: Go crawler, LocalStack S3 (+browser) and headless Chrome. The worker
  #     writes pages to S3 and publishes one event per crawled website to Kafka
  #     (scraped_files_topic) for the ETL DAG; it never writes PostgreSQL. Airflow's
  #     scraper_crawl_schedule DAG starts the crawls; for a one-off crawl use
  #     jobs/on-demand/scraper-crawl.yaml.tmpl. The NetworkPolicy keeps Chrome off the
  #     cluster network (needs a NetworkPolicy-enforcing CNI).
  # - configmaps/scraper-config.yaml
  # - configmaps/s3-init.yaml
  # - services/s3.yaml
  # - services/s3-browser.yaml
  # - services/chrome.yaml
  # - services/scraper-worker-metrics.yaml
  # - services/scraper-api.yaml
  # - deployments/s3.yaml
  # - deployments/s3-browser.yaml
  # - deployments/chrome.yaml
  # - deployments/scraper-worker.yaml
  # - deployments/scraper-api.yaml
  # - networkpolicies/chrome-egress.yaml
  # - networkpolicies/s3-browser-no-ingress.yaml

  # --- scraper-sharded (with `scraper`): three host-sharded workers instead of the
  #     scraper-worker Deployment. Also uncomment the patch under `patches:` below.
  # - services/scraper-worker-sharded.yaml
  # - statefulsets/scraper-worker-sharded.yaml

  # --- ui & web gateway: Next.js UI, Nginx reverse proxy (NodePort 30080), and HA Cloudflare tunnel.
  - configmaps/nginx-config.yaml
  - services/ui.yaml
  - services/nginx.yaml
  - deployments/ui.yaml
  - deployments/nginx.yaml
  - deployments/cloudflared.yaml

  # --- tools: OpenSearch Dashboards. (One-off tools are Jobs in jobs/on-demand/.)
  # - services/opensearch-dashboards.yaml
  # - deployments/opensearch-dashboards.yaml
  # - networkpolicies/opensearch-dashboards-no-ingress.yaml

# scraper-sharded: scale the plain worker Deployment to 0 so only the shards run.
# patches:
#   - target:
#       kind: Deployment
#       name: scraper-worker
#     patch: |
#       - op: replace
#         path: /spec/replicas
#         value: 0

# Passwords, from k8/secrets/secrets.env (gitignored; template: secrets.env.example). The
# name is kept stable because the Airflow task-pod template (a ConfigMap) refers to it by
# name; after changing a value, `kubectl -n pgs-search-engine rollout restart deploy,sts`.
secretGenerator:
  - name: pgs-secrets
    envs:
      - secrets/secrets.env
    options:
      disableNameSuffixHash: true

# Images are the ones `docker compose build` produces, used straight from the local Docker
# engine (Docker Desktop Kubernetes). To use a registry instead, set newName/newTag here
# AND the task-pod image in configmaps/airflow-pod-template.yaml (a ConfigMap string
# Kustomize can't patch).
images:
  - name: pgs-search-engine/postgres
    newTag: local
  - name: pgs-search-engine/db-migrate
    newTag: local
  - name: pgs-search-engine/api
    newTag: local
  - name: pgs-search-engine/etl
    newTag: local
  # used by the optional parts
  - name: pgs-search-engine/search-engine
    newTag: local
  - name: pgs-search-engine/ui
    newTag: local
  - name: pgs-search-engine/scraper-worker
    newTag: local
  - name: pgs-search-engine/scraper-api
    newTag: local
  - name: pgs-search-engine/scraper-cli
    newTag: local
