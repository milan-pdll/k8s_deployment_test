apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app.kubernetes.io/name: nginx
data:
  default.conf: |
    # Reverse proxy entry point for pgs-search-engine in Kubernetes.
    # Routes /api/v1/ and /health/ to the FastAPI gateway (api:8000)
    # and all other routes to the Next.js UI (ui:3000).

    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        server_tokens off;
        client_max_body_size 1m;
        client_body_timeout 15s;
        client_header_timeout 15s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://localboundries.oknp.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript application/geo+json image/svg+xml;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Admin sign-in route
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://ui:3000;
            proxy_set_header Connection "";
        }

        # Live search suggestions
        location = /api/suggest {
            limit_req zone=search burst=20 nodelay;
            proxy_pass http://ui:3000;
            proxy_set_header Connection "";
        }

        # FastAPI gateway
        location /api/v1/ {
            limit_req zone=search burst=30 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /health/ {
            proxy_pass http://api:8000;
            proxy_set_header Connection "";
            proxy_read_timeout 10s;
        }

        # Next.js static files
        location /_next/static/ {
            proxy_pass http://ui:3000;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Next.js UI frontend
        location / {
            proxy_pass http://ui:3000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }
    }
