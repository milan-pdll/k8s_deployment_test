# Non-secret settings shared by the workloads: where each in-cluster service lives.
# Containers reach each other by Service name, as in docker-compose.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgs-config
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  KAFKA_BROKERS: kafka:29092
  OPENSEARCH_HOST: opensearch
  OPENSEARCH_PORT: "9200"
  CLAMD_HOST: clamav
  CLAMD_PORT: "3310"
  SEARCH_GRPC_HOST: search-engine
  SEARCH_GRPC_PORT: "50051"
  TEMPORAL_ADDRESS: temporal:7233
  OPENSEARCH_INDEX: np_web_pages
  # Documents (ETL) and queries (search engine) are embedded with the same model AND
  # revision; see docs/ARCHITECTURE.md.
  EMBEDDING_MODEL_NAME: sentence-transformers/LaBSE
  EMBEDDING_MODEL_REVISION: 836121a0533e5664b21c7aacc5d22951f2b8b25b
  EMBEDDING_DIMENSIONS: "768"
