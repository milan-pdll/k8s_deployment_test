# PGS Search Engine -- the whole stack, from the repository root.
#
#   cp .env.example .env        # once; then adjust (AIRFLOW_UID, passwords, ports)
#   docker compose up -d --build
#
# Data flow (docs/ARCHITECTURE.md has the details):
#
#   domains (PostgreSQL) -> Airflow scraper_crawl_schedule -> Temporal -> scraper-worker
#     -> S3 (pages) + Kafka (one site_crawl_completed event per website)
#     -> Airflow etl_ingestion_pipeline (batches) -> Temporal -> etl-worker (Spark driver)
#        + spark-worker (ClamAV scan, extraction) -> LaBSE -> PostgreSQL Bronze + Silver
#     -> search-indexer -> OpenSearch (np_web_pages) -> search-engine (BM25 + pgvector)
#     -> api (FastAPI) -> ui (Next.js) <- nginx (port 80)
#
# Startup order (health checks and depends_on conditions, no sleeps):
#
#   data-dirs -> postgres -> db-migrate (schema + reference data) -> db-roles ─┬─► api,
#                                                                             │   search-engine,
#                                                                             │   search-indexer
#                                                                             ├─► temporal ─► temporal-ui,
#                                                                             │     etl-worker, scraper-*
#                                                                             └─► airflow-scheduler ─►
#                                                                                   airflow-webserver
#   kafka -> airflow-scheduler, scraper-worker;  opensearch -> search-engine, search-indexer
#   spark-master -> spark-worker (x2), etl-worker;  clamav -> etl-worker;  s3 -> scraper-*
#   api -> ui -> nginx
#
# One PostgreSQL server holds the application database plus Airflow's and Temporal's own
# databases (`airflow`, `temporal`, `temporal_visibility`, each with its own role, created
# by db-roles). Kafka creates its topic on first use (KAFKA_AUTO_CREATE_TOPICS_ENABLE).
#
# Optional services are grouped in profiles, enabled with --profile or COMPOSE_PROFILES:
#   search           gRPC search engine + search indexer (~5 GB RAM, ~4.5 GB of models)
#   scraper          Go crawler: LocalStack S3 (+browser), headless Chrome, worker,
#                    documents API
#   scraper-sharded  three host-sharded crawler workers (instead of scaling one)
#   ui               Next.js UI behind nginx (http://localhost, port 80)
#   tools            OpenSearch Dashboards
#
# THIS FILE IS A LOCAL-DEVELOPMENT DEPLOYMENT: OpenSearch runs without its security
# plugin, LocalStack stands in for S3 with fake credentials, Temporal uses the
# auto-setup image, and nothing speaks TLS. All published ports except nginx's bind to
# 127.0.0.1. See docs/ARCHITECTURE.md ("Production deployment") for what changes.
#
# Containers reach each other by service name (postgres:5432, kafka:29092,
# opensearch:9200, ...). All persistent state is under ./data/<dir> on the host, through
# the volumes declared at the end of this file; data-dirs creates the directories with
# the owner each container runs as. Every service is on the bridge network pgs-network;
# headless Chrome is on its own network (crawl-egress), shared only with the scraper
# workers, so a crawled page it renders cannot reach PostgreSQL, Kafka, OpenSearch, S3...

name: pgs-search-engine

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Bounded json-file logs (Docker's default keeps growing forever).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# The embedding model documents (ETL) and queries (search engine) are embedded with: the
# same name AND Hugging Face revision on both sides, or vector scores are meaningless.
x-embedding-env: &embedding-env
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/LaBSE}
  EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-836121a0533e5664b21c7aacc5d22951f2b8b25b}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}

# The crawl bucket. LocalStack here (any credentials work); for AWS S3 set S3_ENDPOINT=
# (empty) and real S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in .env.
x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT-http://s3:4566}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}

# How the search engine and the indexer reach OpenSearch (credentials only when the
# security plugin is on, i.e. outside local development).
x-opensearch-client-env: &opensearch-client-env
  OPENSEARCH_HOST: ${OPENSEARCH_HOST:-opensearch}
  OPENSEARCH_PORT: ${OPENSEARCH_PORT_INTERNAL:-9200}
  OPENSEARCH_SCHEME: ${OPENSEARCH_SCHEME:-http}
  OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
  OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-np_web_pages}

# ---------------------------------------------------------------------------------
# ETL image (ETL/Dockerfile): Airflow, the Temporal ETL worker, the Spark cluster
# ---------------------------------------------------------------------------------
x-etl-build: &etl-build
  build:
    context: .
    dockerfile: ETL/Dockerfile
  image: pgs-search-engine/etl:local

# The processing side: etl-worker (the Spark driver) and the Spark workers, whose
# executors read S3 and call ClamAV.
x-etl-processing-env: &etl-processing-env
  <<: [*embedding-env, *s3-env]
  TEMPORAL_ADDRESS: temporal:7233
  # spark/security_scanner.py streams every page to ClamAV; a page that cannot be
  # scanned fails the site's run (retried), it is never processed unscanned.
  CLAMD_HOST: clamav
  CLAMD_PORT: "3310"
  CLAMD_TIMEOUT_SECONDS: ${CLAMD_TIMEOUT_SECONDS:-30}

x-airflow-common: &airflow-common
  <<: [*etl-build, *logging]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow's metadata database lives in the shared `postgres` server (database and
    # role `airflow`, created by db-roles).
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Local-development sizing (Airflow default: 4 webserver workers).
    AIRFLOW__WEBSERVER__WORKERS: ${AIRFLOW_WEBSERVER_WORKERS:-2}
    # Leave newly added DAGs unpaused (as the ETL team runs them).
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    KAFKA_BROKERS: kafka:29092
    TEMPORAL_ADDRESS: temporal:7233
    # scraper_crawl_schedule reads the websites (domains) as pgs_etl.
    DATABASE_URL: postgresql+psycopg://pgs_etl:${PGS_ETL_DB_PASSWORD:?set PGS_ETL_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pgs}
    DB_APPLICATION_NAME: pgs-airflow
    # pgs_db_jobs_* DAGs run `python -m pgs_db.jobs` as pgs_jobs.
    PGS_JOBS_DATABASE_URL: postgresql+psycopg://pgs_jobs:${PGS_JOBS_DB_PASSWORD:?set PGS_JOBS_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pgs}
    # etl_ingestion_pipeline: run the ETL once this many site events have arrived, or
    # once the oldest has waited this long.
    ETL_BATCH_SIZE: ${ETL_BATCH_SIZE:-10}
    ETL_BATCH_MAX_WAIT_MINUTES: ${ETL_BATCH_MAX_WAIT_MINUTES:-60}
    ETL_SITE_CONCURRENCY: ${ETL_SITE_CONCURRENCY:-4}
    # scraper_crawl_schedule: when and how the websites are crawled.
    SCRAPER_CRAWL_SCHEDULE: ${SCRAPER_CRAWL_SCHEDULE:-*/30 * * * *}
    SCRAPER_MAX_PAGES_PER_DOMAIN: ${SCRAPER_MAX_PAGES_PER_DOMAIN:-100}
    SCRAPER_MAX_DEPTH: ${SCRAPER_MAX_DEPTH:-3}
    SCRAPER_CONCURRENT_DOMAINS: ${SCRAPER_CONCURRENT_DOMAINS:-20}
    SCRAPER_MAX_CONCURRENT_PER_HOST: ${SCRAPER_MAX_CONCURRENT_PER_HOST:-2}
    SCRAPER_REVISIT_AFTER_HOURS: ${SCRAPER_REVISIT_AFTER_HOURS:-0}
    SCRAPER_COUNTRY_FILTER: ${SCRAPER_COUNTRY_FILTER:-}
    # 3 with the scraper-sharded profile (its workers own three shard queues).
    SCRAPER_TASK_QUEUE_SHARDS: ${SCRAPER_TASK_QUEUE_SHARDS:-1}
  # Live-editable DAGs and the pipeline modules the DAGs import (site_event.py).
  volumes:
    - ./ETL/airflow/dags:/opt/airflow/dags
    - {type: volume, source: data-airflow-logs, target: /opt/airflow/logs, volume: {nocopy: true}}
    - ./ETL/airflow/plugins:/opt/airflow/plugins
    - ./ETL/airflow/config:/opt/airflow/config
    - ./ETL/spark:/opt/airflow/spark_lib:ro
  # Set AIRFLOW_UID to your WSL/Linux user id (`id -u`) so files written to the bind
  # mounts above belong to you.
  user: "${AIRFLOW_UID:-50000}:0"

x-airflow-depends: &airflow-depends
  airflow-scheduler:
    condition: service_healthy

services:
  # data-dirs: One-shot, on every `up`: creates the ./data/<dir> directories behind the
  # volumes (a bind-type volume fails when its directory is missing) and gives each the
  # user its container runs as (OpenSearch and Kafka 1000, ClamAV 100:101, the ETL images
  # AIRFLOW_UID, the search engine 10001), so non-root services can write. Only the top
  # directory is chowned. Every service with a data volume waits for it.
  data-dirs:
    <<: *logging
    networks:
      - pgs-network
    image: busybox:1.37
    command:
      - sh
      - -c
      - |
        set -e
        own() { mkdir -p "/data/$$1" && chown "$$2" "/data/$$1"; }
        # Created here because a bind-type volume needs its directory to exist; their
        # images fix the ownership themselves (postgres) or run as root (localstack).
        mkdir -p /data/postgres /data/localstack
        own opensearch 1000:1000
        own kafka 1000:1000
        own clamav 100:101
        own etl-models "$${AIRFLOW_UID}:0"
        own search-models 10001:10001
        own airflow-logs "$${AIRFLOW_UID}:0"
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    volumes:
      - {type: volume, source: data-root, target: /data, volume: {nocopy: true}}
    restart: "no"

  # =================================================================================
  # PostgreSQL 16 + PostGIS + pgvector (database/Dockerfile)
  # =================================================================================
  # postgres: The one PostgreSQL 16 server (+ PostGIS, pgvector): the application database
  # `pgs` (system of record for crawled and processed pages), plus Airflow's (`airflow`)
  # and Temporal's (`temporal`, `temporal_visibility`) databases.
  postgres:
    <<: *logging
    networks:
      - pgs-network
    build:
      context: ./database
      dockerfile: Dockerfile
    image: pgs-search-engine/postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pgs}
    volumes:
      - {type: volume, source: data-postgres, target: /var/lib/postgresql/data, volume: {nocopy: true}}
    depends_on:
      data-dirs:
        condition: service_completed_successfully
    # Published for host-side tooling (database tests, psql, GUI clients).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    shm_size: 256m
    healthcheck:
      # Over TCP: during first-time init the entrypoint's temporary server only
      # listens on the Unix socket, so this does not report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 1m
    restart: unless-stopped

  # ---------------------------------------------------------------------------------
  # One-shot database tasks (exit 0 when done; re-run, idempotently, on every `up`)
  # ---------------------------------------------------------------------------------
  # db-migrate: One-shot, on every `up`: applies the Alembic migrations (schema,
  # extensions, service roles and their grants) and seeds the reference data
  # (provinces, districts, local bodies, boundaries) and the websites to crawl (domains).
  db-migrate:
    <<: [*hardening, *logging]
    networks:
      - pgs-network
    build:
      context: ./database
      dockerfile: migrate.Dockerfile
    image: pgs-search-engine/db-migrate:local
    # The seeds upsert, so re-running is safe; seed_domains never overrides what an
    # admin changed. Runs as the schema owner; services never do.
    command:
      - sh
      - -c
      - python -m alembic upgrade head && python scripts/seed_geography.py && python scripts/seed_boundaries.py && python scripts/seed_domains.py
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pgs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # db-roles: One-shot, after db-migrate: sets each service role's login password and
  # creates Airflow's and Temporal's roles and databases in this server.
  db-roles:
    <<: *logging
    networks:
      - pgs-network
    build:
      context: ./database
      dockerfile: Dockerfile
    image: pgs-search-engine/postgres:local
    # Gives the service roles the migrations created a login password
    # (database/sql/set-role-passwords.sql, baked into the image), and creates the roles
    # and databases of Airflow (`airflow`) and Temporal (`temporal`, `temporal_visibility`)
    # in this same server. Idempotent.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        psql --no-psqlrc --quiet --file=/opt/pgs/set-role-passwords.sql
        psql --no-psqlrc --quiet -v ON_ERROR_STOP=1 \
          -v airflow_pw="$${AIRFLOW_DB_PASSWORD}" -v temporal_pw="$${TEMPORAL_DB_PASSWORD}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', r) FROM unnest(ARRAY['airflow', 'temporal']) AS r
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = r) \gexec
        ALTER ROLE airflow PASSWORD :'airflow_pw';
        ALTER ROLE temporal PASSWORD :'temporal_pw';
        SELECT format('CREATE DATABASE %I OWNER %I', d, o)
          FROM (VALUES ('airflow', 'airflow'), ('temporal', 'temporal'),
                       ('temporal_visibility', 'temporal')) AS t(d, o)
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = d) \gexec
        SQL
    user: postgres
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-pgs}
      PGDATABASE: ${POSTGRES_DB:-pgs}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGS_API_DB_PASSWORD: ${PGS_API_DB_PASSWORD:?set PGS_API_DB_PASSWORD in .env}
      PGS_ETL_DB_PASSWORD: ${PGS_ETL_DB_PASSWORD}
      PGS_SEARCH_DB_PASSWORD: ${PGS_SEARCH_DB_PASSWORD:?set PGS_SEARCH_DB_PASSWORD in .env}
      PGS_SCRAPER_DB_PASSWORD: ${PGS_SCRAPER_DB_PASSWORD:?set PGS_SCRAPER_DB_PASSWORD in .env}
      PGS_JOBS_DB_PASSWORD: ${PGS_JOBS_DB_PASSWORD:?set PGS_JOBS_DB_PASSWORD in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  # =================================================================================
  # OpenSearch 2.19 (security plugin disabled for local development; reachable only from
  # the Docker network and 127.0.0.1). Holds one index, np_web_pages_v<N> behind the
  # alias np_web_pages (search-engine/src/pgs_search/indexing/mappings.py), fed by the
  # search indexer from PostgreSQL.
  # =================================================================================
  opensearch:
    <<: *logging
    networks:
      - pgs-network
    image: opensearchproject/opensearch:2.19.6
    environment:
      cluster.name: pgs-search
      node.name: opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - {type: volume, source: data-opensearch, target: /usr/share/opensearch/data, volume: {nocopy: true}}
    depends_on:
      data-dirs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${OPENSEARCH_MEMORY_LIMIT:-2g}
    restart: unless-stopped

  # opensearch-dashboards: Optional (profile `tools`): web UI to inspect the index.
  opensearch-dashboards:
    <<: *logging
    networks:
      - pgs-network
    profiles: ["tools"]
    image: opensearchproject/opensearch-dashboards:2.19.6
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  # =================================================================================
  # Kafka 3.8 in KRaft mode (one combined broker/controller, no ZooKeeper)
  #   PLAINTEXT_INTERNAL kafka:29092    containers
  #   PLAINTEXT          localhost:9092 host tools
  # =================================================================================
  # kafka: Carries `scraped_files_topic`: one site_crawl_completed event per website
  # whose crawl finished, from the scraper to the ETL (key = the site's host).
  kafka:
    <<: *logging
    networks:
      - pgs-network
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single broker: every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Persist the log in the volume below (the image default is under /tmp), formatted
      # with a fixed cluster id (the image's default value, pinned so the stored log
      # stays valid across image upgrades).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - {type: volume, source: data-kafka, target: /var/lib/kafka/data, volume: {nocopy: true}}
    depends_on:
      data-dirs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${KAFKA_MEMORY_LIMIT:-1g}
    restart: unless-stopped

  # =================================================================================
  # API gateway (api/Dockerfile)
  # =================================================================================
  # api: FastAPI gateway, the public HTTP API (api/README.md): search (over gRPC to the
  # search engine), geography, admin login and dashboard data; reads PostgreSQL as pgs_api.
  api:
    <<: [*hardening, *logging]
    networks:
      - pgs-network
    build:
      context: .
      dockerfile: api/Dockerfile
    image: pgs-search-engine/api:local
    environment:
      DATABASE_URL: postgresql+psycopg://pgs_api:${PGS_API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-api
      SEARCH_GRPC_HOST: search-engine
      SEARCH_GRPC_PORT: "50051"
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-8}
      # Signs admin tokens (>= 32 characters). Unset: login and /admin answer 503.
      API_AUTH_SECRET: ${API_AUTH_SECRET:-}
      API_TOKEN_TTL_SECONDS: ${API_TOKEN_TTL_SECONDS:-28800}
      # Cross-origin browser callers (comma-separated origins); the UI needs none.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db-roles:
        condition: service_completed_successfully
      # Only with the `search` profile; without it /api/v1/search answers 503 and
      # /health/ready reports search as degraded.
      search-engine:
        condition: service_started
        required: false
    restart: unless-stopped

  # =================================================================================
  # UI (ui/Dockerfile) and nginx -- profile `ui`
  # =================================================================================
  # ui: Next.js front end. Its server calls the API at API_INTERNAL_URL; browsers reach
  # both through nginx on one origin.
  ui:
    <<: [*hardening, *logging]
    networks:
      - pgs-network
    profiles: ["ui"]
    build:
      context: ./ui
    image: pgs-search-engine/ui:local
    environment:
      API_INTERNAL_URL: http://api:8000
      API_TIMEOUT_MS: ${UI_API_TIMEOUT_MS:-10000}
      # auto: the session cookie is Secure when the request came in over https.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
    # Also published directly (http://localhost:3000) for UI development.
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # nginx: The stack's web entry point (nginx/default.conf): /api/v1/ and /health/ to the
  # API, the rest to the UI. Published on all interfaces by default so a domain can
  # reach it; set HTTP_BIND_ADDRESS=127.0.0.1 in .env to keep it local.
  nginx:
    <<: [*hardening, *logging]
    networks:
      - pgs-network
    profiles: ["ui"]
    image: nginxinc/nginx-unprivileged:1.27-alpine
    # Port 80 inside the container too (http://nginx on the network). nginx runs as a
    # non-root user with every capability dropped; this per-container setting lets it
    # bind a port below 1024 without root or NET_BIND_SERVICE.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # =================================================================================
  # ETL: ClamAV, Airflow (LocalExecutor; the work runs on Temporal + Spark)
  # =================================================================================
  # clamav: Antivirus daemon: the Spark executors stream every crawled page to it. Its
  # image's healthcheck (clamdcheck.sh) allows 6 minutes for the first signature
  # download; the volume keeps the signatures across restarts.
  clamav:
    <<: *logging
    networks:
      - pgs-network
    image: clamav/clamav:1.4
    volumes:
      - {type: volume, source: data-clamav, target: /var/lib/clamav, volume: {nocopy: true}}
    depends_on:
      data-dirs:
        condition: service_completed_successfully
    # Published for running the scanner tests against a live daemon (CLAMD_HOST=localhost).
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    deploy:
      resources:
        limits:
          memory: ${CLAMAV_MEMORY_LIMIT:-2g}
    restart: unless-stopped

  # airflow-webserver: Airflow web UI: DAG runs, task logs, manual triggers.
  airflow-webserver:
    <<: *airflow-common
    networks:
      - pgs-network
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on: *airflow-depends
    restart: unless-stopped

  # airflow-scheduler: Airflow scheduler (LocalExecutor: it runs the lightweight task
  # processes itself). Runs scraper_crawl_schedule (starts the crawl of every website
  # on Temporal), etl_ingestion_pipeline (hands each batch of crawled sites to Temporal)
  # and the pgs_db_jobs_* maintenance DAGs. On every start the image's entrypoint first
  # migrates Airflow's database and creates the admin login (both idempotent).
  airflow-scheduler:
    <<: *airflow-common
    networks:
      - pgs-network
    command: scheduler
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      data-dirs:
        condition: service_completed_successfully
      db-roles:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  # =================================================================================
  # Spark standalone cluster + the Temporal ETL worker (the Spark driver)
  #
  # All three run the ETL image's /opt/etl-venv: executors need the same Python and
  # packages as the driver. Scale the workers with SPARK_WORKERS.
  # =================================================================================
  # spark-master: accepts the ETL worker's Spark application and schedules its tasks.
  spark-master:
    <<: [*etl-build, *hardening, *logging]
    networks:
      - pgs-network
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["/opt/etl-venv/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    # Spark master UI (Airflow owns 8080 on the host).
    ports:
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # spark-worker: SPARK_WORKERS of them; run the executors that do the per-page work
  # (read the page from S3, ClamAV scan, text extraction).
  spark-worker:
    <<: [*etl-build, *hardening, *logging]
    networks:
      - pgs-network
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["/opt/etl-venv/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES:-2}", "--memory", "${SPARK_WORKER_MEMORY:-2g}",
              "--work-dir", "/tmp/spark-work"]
    environment: *etl-processing-env
    healthcheck:
      # The worker's web UI (8081 inside the container) is up once it registered.
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8081"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      replicas: ${SPARK_WORKERS:-2}
      resources:
        limits:
          memory: ${SPARK_WORKER_MEMORY_LIMIT:-3g}
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped

  # etl-worker: Temporal worker for EtlBatchWorkflow (ETL/temporal) on the etl-task-queue,
  # and the Spark driver: one long-lived Spark application, one LaBSE model and one
  # PostgreSQL pool; each site is one activity that ends with the pages saved to
  # Bronze + Silver (role pgs_etl).
  etl-worker:
    <<: [*etl-build, *hardening, *logging]
    networks:
      - pgs-network
    # /entrypoint gives AIRFLOW_UID a passwd entry and home, which Spark's launcher
    # needs; it passes `bash` commands through (anything else becomes `airflow ...`).
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint"]
    command: ["bash", "-c", "exec /opt/etl-venv/bin/python worker.py"]
    working_dir: /opt/etl/temporal
    environment:
      <<: *etl-processing-env
      DATABASE_URL: postgresql+psycopg://pgs_etl:${PGS_ETL_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-etl-worker
      SPARK_MASTER: spark://spark-master:7077
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
      SPARK_EXECUTOR_CORES: "1"
      ETL_SITE_CONCURRENCY: ${ETL_SITE_CONCURRENCY:-4}
      ETL_PAGE_GROUP_SIZE: ${ETL_PAGE_GROUP_SIZE:-200}
      ETL_MAX_SITE_ATTEMPTS: ${ETL_MAX_SITE_ATTEMPTS:-5}
      ETL_SHUTDOWN_GRACE_SECONDS: "90"
      ETL_HEARTBEAT_FILE: /tmp/etl-worker.alive
    volumes:
      - ./ETL/temporal:/opt/etl/temporal:ro
      - ./ETL/spark:/opt/airflow/spark_lib:ro
      # Hugging Face cache, so LaBSE (~1.8 GB) downloads once.
      - {type: volume, source: data-etl-models, target: /home/airflow/.cache/huggingface, volume: {nocopy: true}}
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      # The worker touches the file every 30 s while it is connected and running.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/etl-worker.alive 2>/dev/null || echo 0) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Longer than ETL_SHUTDOWN_GRACE_SECONDS: running sites finish (or are cancelled and
    # retried by Temporal) before Docker kills the process.
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          memory: ${ETL_WORKER_MEMORY_LIMIT:-5g}
    depends_on:
      data-dirs:
        condition: service_completed_successfully
      db-roles:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped

  # =================================================================================
  # Search (search-engine/Dockerfile) -- profile `search`
  # =================================================================================
  # search-engine: gRPC SearchService on :50051 (BM25 on OpenSearch + LaBSE/pgvector +
  # NLLB query translation + LightGBM rerank). Creates the index (alias) if missing,
  # loads its models, then serves; grpc.health.v1 reports SERVING when ready.
  search-engine:
    <<: [*hardening, *logging]
    networks:
      - pgs-network
    profiles: ["search"]
    build:
      context: .
      dockerfile: search-engine/Dockerfile
    image: pgs-search-engine/search-engine:local
    command: ["python", "-m", "pgs_search.grpc.server"]
    environment:
      <<: [*embedding-env, *opensearch-client-env]
      SEARCH_GRPC_HOST: 0.0.0.0
      SEARCH_GRPC_PORT: "50051"
      SEARCH_GRPC_WORKERS: ${SEARCH_GRPC_WORKERS:-8}
      TRANSLATION_ENABLED: ${SEARCH_TRANSLATION_ENABLED:-true}
      TRANSLATION_QUANTIZE: ${SEARCH_TRANSLATION_QUANTIZE:-false}
      TRANSLATION_BACKEND: ${SEARCH_TRANSLATION_BACKEND:-local}
      TRANSLATION_API_BASE_URL: ${SEARCH_TRANSLATION_API_BASE_URL:-https://openrouter.ai/api/v1}
      TRANSLATION_API_MODEL: ${SEARCH_TRANSLATION_API_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      TRANSLATION_API_KEY: ${SEARCH_TRANSLATION_API_KEY:-}
      TRANSLATION_MODEL_REVISION: ${TRANSLATION_MODEL_REVISION:-f8d333a098d19b4fd9a8b18f94170487ad3f821d}
      # Dense retrieval through pgs_db (page_embeddings, pgvector) as pgs_search.
      DATABASE_URL: postgresql+psycopg://pgs_search:${PGS_SEARCH_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-search
    volumes:
      # Hugging Face model cache, so the models download once, not on every start.
      - {type: volume, source: data-search-models, target: /home/app/.cache/huggingface, volume: {nocopy: true}}
    # Published for search-engine/scripts/test_grpc_client.py (localhost:50051).
    ports:
      - "127.0.0.1:${SEARCH_GRPC_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g; s = g.HealthStub(grpc.insecure_channel('127.0.0.1:50051')).Check(h.HealthCheckRequest(service='search.engine.v1.SearchService'), timeout=3); raise SystemExit(s.status != h.HealthCheckResponse.SERVING)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads ~4.5 GB of models.
      start_period: 30m
      start_interval: 15s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: ${SEARCH_ENGINE_MEMORY_LIMIT:-6g}
    depends_on:
      data-dirs:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    restart: unless-stopped

  # search-indexer: keeps OpenSearch a copy of PostgreSQL Silver
  # (pgs_search.indexing.indexer): claims pages the ETL saved, bulk-indexes them
  # (_id = page id), marks them. Same image as the search engine, no models.
  search-indexer:
    <<: [*hardening, *logging]
    networks:
      - pgs-network
    profiles: ["search"]
    image: pgs-search-engine/search-engine:local
    command: ["python", "-m", "pgs_search.indexing.indexer"]
    environment:
      <<: *opensearch-client-env
      DATABASE_URL: postgresql+psycopg://pgs_search:${PGS_SEARCH_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgs}
      DB_APPLICATION_NAME: pgs-search-indexer
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-100}
      INDEXER_HEARTBEAT_FILE: /tmp/indexer.alive
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/indexer.alive') > 180)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      opensearch:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    restart: unless-stopped

  # =================================================================================
  # Temporal (durable workflows) -- the crawl workflows (scraper-worker) and the ETL
  # batch workflows (etl-worker); its state is in the shared postgres. auto-setup
  # creates its schemas and the `default` namespace (a development image; production
  # runs temporalio/server with the schema managed by temporal-sql-tool).
  # =================================================================================
  temporal:
    <<: *logging
    networks:
      - pgs-network
    image: temporalio/auto-setup:1.24.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      # Its databases (temporal, temporal_visibility) are in the shared `postgres`
      # server, created by db-roles; auto-setup creates their schemas.
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: postgres
      SKIP_DB_CREATE: "true"
    # Published for running cmd/scraper or cmd/worker on the host.
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      # Healthy once the `default` namespace the workers and clients use exists. The
      # frontend binds to the container's IP, not localhost.
      test: ["CMD-SHELL", "temporal operator namespace describe --namespace default --address $$(hostname -i):7233 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: unless-stopped

  # temporal-ui: inspect crawl and ETL workflows, their activities and retries.
  temporal-ui:
    <<: *logging
    networks:
      - pgs-network
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8233}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

  # =================================================================================
  # Scraper (scraper/Dockerfile, one target per binary) -- profile `scraper`
  #
  # The worker uploads each crawled page (complete HTML + metadata) to S3 -- LocalStack
  # here -- and publishes one event per website whose crawl finished to
  # `scraped_files_topic`. It never writes PostgreSQL. It refuses to connect to
  # non-public addresses (scraper/internal/netguard), and Chrome renders pages from an
  # isolated network.
  # =================================================================================
  # s3: LocalStack S3, the `crawled-pages` bucket: the scraper writes every page's HTML
  # and metadata; the ETL reads them and writes a marker per processed site (_etl/).
  s3:
    <<: *logging
    networks:
      - pgs-network
    profiles: ["scraper", "scraper-sharded"]
    image: localstack/localstack:3.8
    # S3 only; the s3-create-bucket config (end of this file) creates the bucket once S3
    # is ready. data-localstack keeps LocalStack's cache, logs and state files; the S3
    # objects themselves do not survive a restart (persistence is a LocalStack Pro
    # feature).
    environment:
      SERVICES: s3
    depends_on:
      data-dirs:
        condition: service_completed_successfully
    volumes:
      - {type: volume, source: data-localstack, target: /var/lib/localstack, volume: {nocopy: true}}
    configs:
      - source: s3-create-bucket
        target: /etc/localstack/init/ready.d/create-bucket.sh
        mode: 0755
    # Published for host tools (aws --endpoint-url http://localhost:4566 ...).
    ports:
      - "127.0.0.1:${S3_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://crawled-pages"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # s3-browser: web UI to browse the bucket (open crawled-pages, then html/<host>/).
  s3-browser:
    <<: *logging
    networks:
      - pgs-network
    profiles: ["scraper", "scraper-sharded"]
    image: cloudlena/s3manager:v0.11.0
    environment:
      ENDPOINT: s3:4566
      REGION: ${AWS_REGION:-us-east-1}
      ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      USE_SSL: "false"
    ports:
      - "127.0.0.1:${S3_BROWSER_PORT:-8081}:8080"
    depends_on:
      s3:
        condition: service_healthy
    restart: unless-stopped

  # chrome: Headless Chrome: renders JavaScript-built pages for the scraper workers
  # (--render=auto). Only on crawl-egress: it can reach the internet and the workers,
  # never PostgreSQL, Kafka, OpenSearch, S3 or Temporal.
  chrome:
    <<: *logging
    networks:
      - crawl-egress
    profiles: ["scraper", "scraper-sharded"]
    image: chromedp/headless-shell:151.0.7922.109
    shm_size: 1gb
    # No healthcheck: the image has no HTTP client to probe the DevTools port with. The
    # workers fall back to the static HTML when Chrome is not answering (--render=auto).
    deploy:
      resources:
        limits:
          memory: ${CHROME_MEMORY_LIMIT:-2g}
    restart: unless-stopped

  # scraper-worker: Go crawler worker: executes the crawl workflows on Temporal (fetch,
  # robots.txt, render, parse), writes pages to S3, and publishes one Kafka event per
  # finished website.
  scraper-worker: &scraper-worker
    <<: [*hardening, *logging]
    networks:
      - pgs-network
      - crawl-egress
    profiles: ["scraper"]
    build:
      context: ./scraper
      target: worker
    image: pgs-search-engine/scraper-worker:local
    # The worker's flags, as environment variables of the same name. Scale with
    # `docker compose up -d --scale scraper-worker=N`: replicas share the Temporal task
    # queue and load-balance automatically.
    environment: &scraper-worker-env
      <<: *s3-env
      TEMPORAL_ADDRESS: temporal:7233
      STORAGE: ${SCRAPER_STORAGE:-s3}
      RENDER: ${SCRAPER_RENDER:-auto}
      CHROME_URL: ws://chrome:9222
      S3_BUCKET: crawled-pages
      # Publish the site-crawled event for the ETL DAG; set SCRAPER_KAFKA_BROKERS=
      # (empty) in .env to write S3 only.
      KAFKA_BROKERS: ${SCRAPER_KAFKA_BROKERS-kafka:29092}
      KAFKA_TOPIC: scraped_files_topic
    # Running activities are given time to finish (Temporal retries what is cut off).
    stop_grace_period: 1m
    depends_on:
      temporal:
        condition: service_healthy
      s3:
        condition: service_healthy
      chrome:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # scraper-worker-shard-N: Host-sharded crawler workers (profile `scraper-sharded`,
  # instead of scraper-worker): each host's fetches are routed to one of three shard
  # queues and each worker owns one shard, so a host is only ever fetched (rate-limited,
  # robots-checked, DNS-cached) by one container. Set SCRAPER_TASK_QUEUE_SHARDS=3.
  scraper-worker-shard-0:
    <<: *scraper-worker
    profiles: ["scraper-sharded"]
    environment:
      <<: *scraper-worker-env
      TASK_QUEUE_SHARDS: "3"
      SHARD_INDEX: "0"
      METRICS_ADDRESS: ""

  scraper-worker-shard-1:
    <<: *scraper-worker
    profiles: ["scraper-sharded"]
    environment:
      <<: *scraper-worker-env
      TASK_QUEUE_SHARDS: "3"
      SHARD_INDEX: "1"
      METRICS_ADDRESS: ""

  scraper-worker-shard-2:
    <<: *scraper-worker
    profiles: ["scraper-sharded"]
    environment:
      <<: *scraper-worker-env
      TASK_QUEUE_SHARDS: "3"
      SHARD_INDEX: "2"
      METRICS_ADDRESS: ""

  # scraper-api: Read-only documents API + Swagger UI over the bucket
  # (http://localhost:8082/docs): browse crawl runs and crawled pages.
  scraper-api:
    <<: [*hardening, *logging]
    networks:
      - pgs-network
    profiles: ["scraper", "scraper-sharded"]
    build:
      context: ./scraper
      target: api
    image: pgs-search-engine/scraper-api:local
    environment:
      <<: *s3-env
      S3_BUCKET: crawled-pages
    ports:
      - "127.0.0.1:${SCRAPER_API_PORT:-8082}:8080"
    depends_on:
      s3:
        condition: service_healthy
    restart: unless-stopped

# ---------------------------------------------------------------------------------
# Volumes: every one is a bind-type local volume on a directory under ./data (created
# by data-dirs), so all state lives on the host, in one place. `docker compose down -v`
# removes the volume objects only, never the files; delete ./data/<dir> to reset one.
# Services mount them with `nocopy: true`: nothing from the image is copied in, and the
# directory is only mounted when the container starts, after data-dirs has created it.
# ---------------------------------------------------------------------------------
volumes:
  # parent of all the directories below (for data-dirs)
  data-root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  # PostgreSQL: pgs, airflow, temporal, temporal_visibility
  data-postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  # OpenSearch index (a copy of PostgreSQL Silver; rebuildable by the indexer)
  data-opensearch:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/opensearch
  # Kafka log (scraped_files_topic, consumer offsets)
  data-kafka:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/kafka
  # ClamAV signatures
  data-clamav:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/clamav
  # LocalStack cache/logs/state
  data-localstack:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/localstack
  # Hugging Face cache of the ETL worker: LaBSE (~1.8 GB)
  data-etl-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/etl-models
  # Hugging Face cache of the search engine: NLLB-200 (~2.5 GB) + LaBSE (~1.8 GB)
  data-search-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/search-models
  # Airflow task logs
  data-airflow-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/airflow-logs

# Files given to containers. s3-create-bucket is a LocalStack ready.d hook: LocalStack
# runs it once S3 is up.
configs:
  s3-create-bucket:
    content: |
      #!/bin/sh
      awslocal s3 mb s3://crawled-pages

networks:
  # Every service is attached to it and reaches the others by service name.
  pgs-network:
    driver: bridge
  # Headless Chrome and the scraper workers only: Chrome loads whatever a crawled page
  # asks for, so it must not share a network with the internal services.
  crawl-egress:
    driver: bridge
