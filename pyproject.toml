[tool.ruff]
line-length = 100
target-version = "py311"
src = ["api/src", "database/src", "search-engine/src"]
# Generated code: the gRPC stubs (grpc_tools.protoc) and Alembic revisions (kept as
# `alembic revision --autogenerate` writes them).
extend-exclude = [
    "search-engine/src/pgs_search/grpc/generated",
    "database/migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["pgs_api", "pgs_db", "pgs_search"]

[tool.pyright]
include = ["api/src", "api/tests", "database/src"]
# The API's own package and the search engine's generated gRPC stubs it imports.
extraPaths = ["api/src", "search-engine/src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.11"
