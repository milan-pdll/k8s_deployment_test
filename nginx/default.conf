# Reverse proxy and the stack's web entry point (the `nginx` service of the root
# docker-compose.yml): /api/v1/ and /health/ go to the FastAPI gateway, everything else
# to the Next.js UI -- one origin, so the browser needs no CORS. Answers for any host
# name, so http://localhost and any domain whose DNS points at this machine both work.
# It listens on port 80, inside the Docker network as well (http://nginx); compose
# publishes it as host port HTTP_PORT. nginx runs as a non-root user: compose lets the
# container bind ports below 1024 (net.ipv4.ip_unprivileged_port_start=0).
#
# TLS is terminated in front of this (a load balancer or a certbot sidecar) in a
# production deployment; X-Forwarded-Proto is passed on so the UI marks its session
# cookie Secure.

# Docker's embedded DNS: `ui` and `api` are re-resolved while running, so a restarted
# container (new IP) is picked up without restarting nginx, and nginx starts even before
# they are up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ui {
    zone ui 64k;
    server ui:3000 resolve;
    keepalive 16;
}

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 16;
}

# Per-client request limits (brute-force and scraping brake). Behind a load balancer, make
# sure $remote_addr is the client (real_ip module), or every client shares one bucket.
limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;
limit_req_status 429;

# WebSocket upgrades pass through; everything else keeps the connection alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    # Nothing in this stack accepts uploads; requests are queries and logins.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Next's inline bootstrap scripts need 'unsafe-inline' (a nonce would need per-request
    # rendering); everything else stays on this origin, except the boundary-map host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://localboundries.oknp.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/geo+json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Liveness of nginx itself (compose healthcheck); not proxied.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Admin sign-in (the UI route that forwards to /api/v1/auth/login).
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://ui;
        proxy_set_header Connection "";
    }

    # Live suggestions while typing: one search per request.
    location = /api/suggest {
        limit_req zone=search burst=20 nodelay;
        proxy_pass http://ui;
        proxy_set_header Connection "";
    }

    # The API gateway. A search may take up to the API's SEARCH_TIMEOUT_SECONDS.
    location /api/v1/ {
        limit_req zone=search burst=30 nodelay;
        proxy_pass http://api;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://api;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    # Next's hashed build assets never change for a given file name.
    location /_next/static/ {
        proxy_pass http://ui;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://ui;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
