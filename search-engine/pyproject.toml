[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgs-search"
version = "0.1.0"
description = "Search Engine Core for PGS"
requires-python = ">=3.11"
dependencies = [
    # Exact pins for what the image installs; search-engine/constraints.txt pins the rest
    # of the closure (regenerate it after changing this list -- command in its header).
    "opensearch-py==3.2.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "nltk==3.10.3",
    # Same versions as the ETL (documents and queries are embedded by the same code).
    "torch==2.14.1",
    "transformers==5.18.0",
    "sentence-transformers==6.1.0",
    "sentencepiece==0.2.2",
    # The Nepali lemmatizer pipeline (query/nepali_lemma) was pickled with 1.9.0.
    "scikit-learn==1.9.0",
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "grpcio==1.84.0",
    "grpcio-health-checking==1.84.0",
    # The generated stubs (grpc/generated) require at least the protobuf they were
    # generated with.
    "protobuf==7.35.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pyright>=1.1",
    # Regenerates grpc/generated from proto/search.proto (see README).
    "grpcio-tools==1.84.0",
]
# scripts/train_reranker.py
train = [
    "pandas==3.0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgs_search = ["query/data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: integration tests that load the real Nepali lemmatization pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/pgs_search/grpc/generated"]
